name: door_to_door_shipping
description: "Door-to-door shipping ledger for yard staff and management (USA → overseas)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase — placeholders only until a project is wired (no google-services.json required to analyze)
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  shared_preferences: ^2.5.5
  google_mlkit_text_recognition: ^0.16.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
